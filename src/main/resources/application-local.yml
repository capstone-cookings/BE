spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cookapp?serverTimezone=Asia/Seoul
    username: root
    password: 4014
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 300MB
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate.format_sql: true
      dialect: org.hibernate.dialect.MySQL8InnoDBDialect
  data:
    redis:
      host: localhost
      port: 6379
      password: 4014

logging:
  level:
    org.hibernate.SQL: debug
    org.springframework.cache: trace # Redis

  security:
    user:
      name: user
      password: password

file:
  upload-dir: upload

jwt:
  secret: ${JWT_SECRET_KEY}

kakao:
  client_id: ${KAKAO_ID}
  redirect_uri: http://localhost:8080/callback

openai:
  api-url: https://api.openai.com/v1/chat/completions
  api-key: Bearer ${OPENAI_SECRET_KEY}

cloud:
  aws:
    s3:
      path:
        profile: profile
        post: post
        ingredient: ingredient
        recipe: recipe
        trustlevel: trustlevel
      bucket: ${AWS_S3_BUCKET}
    region:
      static: ap-northeast-2
    stack:
      auto: false
    credentials:
      accessKey: ${AWS_S3_ACCESS_KEY_ID}
      secretKey: ${AWS_S3_SECRET_ACCESS_KEY}