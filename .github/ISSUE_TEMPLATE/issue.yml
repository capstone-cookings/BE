name: "이슈 생성 템플릿"
description: "이슈 생성 템플릿을 작성해 이슈를 생성해주세요"
title: ""
labels: []
assignees: []

body:
  - type: markdown
    attributes:
      value: "### 🔍 목적\n이슈의 주요 목적이나 해결해야 할 문제를 간단히 적어주세요."

  - type: textarea
    id: description
    attributes:
      label: "설명"
      description: "이슈의 목적을 자세히 적어주세요."
      placeholder: "예: 로그인 API의 JWT 만료 시간을 30분에서 1시간으로 늘려야 함"
    validations:
      required: true

  - type: checkboxes
    id: tasks
    attributes:
      label: "📝 작업 내용"
      description: "해야 할 작업 목록을 체크하세요."
      options:
        - label: "작업 1"
        - label: "작업 2"
        - label: "작업 3"

  - type: textarea
    id: warning
    attributes:
      label: "⚠ 주의 사항"
      description: "고려해야 할 주의 사항이나 추가 설명을 적어주세요."
      placeholder: "예: DB 마이그레이션이 필요함"
